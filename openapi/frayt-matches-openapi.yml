              \ You can also specify only the type, in which case the smallest vehicle class for that type will be selected.<br/>\n\
              \            "
            type: string
          - description: Set `1` for car, `2` for midsize, `3` for cargo van, and `4` for box truck, and `5` for pickup truck.
            type: integer
