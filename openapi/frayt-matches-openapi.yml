            \  <li> 5ft </li>\n              <li> 6ft </li>\n              <li> 8ft </li>\n            </ul>\n          <li>\
            \ box_truck </li>\n        </ul>\n        <br/> NOTE: This can be left empty only if auto selection is enabled\
            \ on your account. Reach out to the FRAYT team for more details"
          nullable: true
