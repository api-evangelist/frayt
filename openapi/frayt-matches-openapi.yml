          description: 'Current Stop state.<br/>

            <br/>A successful Match Stop will transition through some or all of these states:<br/>

            Pending –> En Route –> Arrived –> Signed –> Delivered –> Returned

            <hr/>

            Re Routed <i>this is a dummy stop for recordkeeping purposes. The original stop has been modified.</i><br/>Unserved
            <i>this stop was unable to be served in a Match. This state is only possible for Batches. A reason will be provided.</i><br/>Undeliverable
            <i>the driver was unable to deliver this stop. A reason will be provided.</i><br/>Pending <i>the driver is not
