          - 'null'
        vehicle_class:
          description: "You can especify the vehicle class and type for this match. It can be either a number or a string (see the documentation below) <br/>\n        <br/> List of available vehicle classes and types:\n        <ul>\n          <li> car </li>\n          <li> midsize </li>\n          <li> cargo_van </li>\n            <ul>\n              <li> transit </li>\n              <li> standard </li>\n              <li> sprinter </li>\n            </ul>\n          <li> pickup_truck </li>\n            <ul>\n              <li> 4ft </li>\n              <li> 5ft </li>\n              <li> 6ft </li>\n              <li> 8ft </li>\n            </ul>\n          <li> box_truck </li>\n        </ul>\n        <br/> NOTE: This can be left empty only if auto selection is enabled on your account. Reach out to the FRAYT team for more details"
          oneOf:
          - description: "<br/> A combination of vehicle type key and vehicle class key can be used to select a specific vehicle type. <br/>\n            <br/> For example, to select a sprinter van, the value would be `cargo_van.sprinter` You can also specify only the type, in which case the smallest vehicle class for that type will be selected.<br/>\n            "
            type: string
          - description: Set `1` for car, `2` for midsize, `3` for cargo van, and `4` for box truck, and `5` for pickup truck.
            type: integer
