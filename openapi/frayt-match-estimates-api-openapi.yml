        slas:
          description: List of the pickup and delivery SLAs for this Match
          items:
            $ref: '#/components/schemas/SLA'
          type: array
        state:
          description: 'Current Match state<br/>

            <br/>A successful Match will transition through some or all of these states:<br/>

            Pending –> Inactive –> Scheduled –> Assigning Driver –> Offered –> Offer Not Accepted –> Accepted –> En Route To Pickup –> Arrived At Pickup –> Picked Up –> En Route To Return –> Arrived At Return –> Completed –> Charged

            <hr/>

            Unable To Pickup <i>the driver was unable to pick up all items.</i><br/>Driver Canceled <i>the driver has removed himself from a Match. The Match itself is not canceled and will be sent out to other available drivers.</i><br/>Admin Canceled <i>has been canceled by the FRAYT team</i><br/>Shipper Canceled <i>was canceled by the shipper</i><br/>Pending <i>has been estimated, but not authorized</i><br/>Inactive <i>is awaiting action from the FRAYT team before it can be sent out to drivers</i><br/>Scheduled <i>is currently scheduled for a future time, and has not been sent to drivers</i><br/>Assigning Driver <i>we are in the process of finding an available driver to assign to this Match</i><br/>Offered <i>has been offered to a driver, but has not been accepted</i><br/>Offer Not Accepted <i>the driver offered this match did not accept.</i><br/>Accepted <i>has been accepted by a driver, but is not yet on the way</i><br/>En Route To Pickup <i>the driver is on the way to the pickup location</i><br/>Arrived At Pickup <i>the driver has arrived at the pickup location</i><br/>Picked Up <i>the driver has picked up all items. Details updates on individual stops can be found under the stops state.</i><br/>En Route To Return <i>the driver is returning back to the pick up point.</i><br/>Arrived At Return <i>the driver has reached the pickup point.</i><br/>Completed <i>all stops have been completed, but not yet charged</i><br/>Charged <i>the Match has been completed and charged</i>

            '
          enum:
          - accepted
          - admin_canceled
          - arrived_at_pickup
          - arrived_at_return
          - assigning_driver
          - canceled
          - charged
          - completed
          - driver_canceled
          - en_route_to_pickup
          - en_route_to_return
          - inactive
          - offer_not_accepted
          - offered
          - pending
          - picked_up
          - scheduled
          - unable_to_pickup
          type: string
        state_transition:
          oneOf:
          - $ref: '#/components/schemas/StateTransition'
          type: object
        stops:
          description: Stops along this Match's route
          items:
            $ref: '#/components/schemas/MatchStop'
          type: array
        timeframe:
          description: Timeframes for this Match
          oneOf:
          - $ref: '#/components/schemas/Stop_Timeframe'
          type: object
        total_distance:
          description: Total distance from origin to all stops
          format: float
