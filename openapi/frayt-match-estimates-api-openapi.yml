        earliest_arrival:
          description: Earliest expected arrival time at the stop
          format: date-time
          type: string
        end_time:
          deprecated: true
          description: 'Deprecated: use latest_arrival instead'
          format: date-time
          type: string
        latest_arrival:
          description: Latest expected arrival time at the stop
          format: date-time
          type: string
        latest_completion:
          description: Latest expected completion time at the stop (latest_arrival + handling)
          format: date-time
          type: string
        start_time:
          deprecated: true
          description: 'Deprecated: use earliest_arrival instead'
          format: date-time
          type: string
        updated_at:
          description: Timestamp of the last update to the timeframe
          format: date-time
          type: string
      title: Timeframe
      type: object
    Invalid_Parameters:
      description: Error response when invalid paramaters are passed
      properties:
        errors:
          items:
            properties:
              detail:
                type: string
              source:
                properties:
                  pointer:
                    type: string
                type: object
              title:
                type: string
            type: object
          type: array
      title: Invalid Parameters
      type: object
