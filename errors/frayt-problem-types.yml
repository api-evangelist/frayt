note: >-
  FRAYT does NOT use RFC 9457 problem+json. Every 4xx response is
  `application/json` carrying a flat two-field envelope — `{"code": "<machine
  code>", "message": "<human readable>"}` — confirmed live: an unauthenticated GET
  of /api/v2.2/matches/{id} returned HTTP 401 with body
  {"code":"unauthenticated","message":"You are not logged in"}. The one exception is
  the 422 "Invalid Parameters" shape used on validation failures, which is a JSON:API
  style `{"errors": [{"title", "detail", "source": {"pointer"}}]}` array — so the
  API carries TWO distinct error envelopes and a client must branch on status to
  parse. No 429 response, no Retry-After and no rate-limit schema appear anywhere in
  the spec. FRAYT publishes no standalone error-code reference page, so the `code`
  values below are only those the spec's own examples emit; the full vocabulary of
  `code` strings is not published.
