note: >-
  The FRAYT domain is a single aggregate root — the Match — with an ordered list of
  Stops beneath it and Items beneath each Stop. Everything else (Driver, Address,
  Contact, Accessorial, SLA, Timeframe, StateTransition) hangs off one of those
  three. Identifiers are UUID v4; money is integer cents; timestamps are ISO 8601 UTC.
root_entity: Match
entities:
- name: Match
  description: >-
    One delivery order. Created either directly (POST /matches, already authorized)
    or by authorizing an Estimate. Carries pricing, the assigned Driver, the ordered
    Stops, the state machine and its most recent transition.
  id_field: id
  id_format: uuid
  human_reference: shortcode
  shipper_reference: [identifier, po, route_identifier]
  state_field: state
  schema: Match
  key_fields: [id, state, state_transition, total_price, total_distance, total_weight,
    total_volume, service_level, vehicle_class, scheduled, pickup_at, dropoff_at, shortcode]
- name: MatchStop
  description: >-
    An ordered destination within a Match. Holds its own state machine, recipient,
    proof-of-delivery requirements, driver tip and tracking URL.
  id_field: id
  id_format: uuid
  state_field: state
  schema: MatchStop
  key_fields: [id, index, route_index, state, destination_address, recipient, items,
    driver_tip, tracking_url, signature_required, id_verification_required]
- name: MatchStopItem
  description: A physical item at a stop, with dimensions, weight, declared value and barcodes.
  id_field: id
  id_format: uuid
  schema: MatchStopItem
  key_fields: [id, stop_id, description, type, pieces, weight, volume, length, width,
    height, declared_value, barcode, container_barcode]
- name: Driver
  description: The driver assigned to the Match, with live location while en route.
  id_field: id
  id_format: uuid
  schema: Driver
  key_fields: [id, first_name, last_name, email, phone_number, current_location,
    vehicle_make, vehicle_model, vehicle_year]
- name: Address
  description: A resolved, geocoded address used as an origin or a stop destination.
  schema: Address
  key_fields: [address, address2, city, state_code, zip, country_code, lat, lng, neighborhood, name]
- name: Contact
  description: A person on the Match — the sender on the Match, or the recipient on a Stop.
  schema: Contact
  key_fields: [name, email, phone_number, notify]
- name: Accessorial
  description: A priced add-on requirement, e.g. TSA certification for airport access.
  id_field: id
  id_format: uuid
  schema: Accessorial
  key_fields: [id, key, name, description]
- name: StateTransition
  description: >-
    A record of one state change. Polymorphic by nullability — match_id is set for a
    match-level transition, stop_id for a stop-level one.
  schema: StateTransition
  key_fields: [from, to, notes, match_id, stop_id, updated_at]
- name: SLA
  description: A service-level commitment attached to the Match.
  schema: SLA
- name: Timeframe
  description: A pickup or delivery window on the Match or a Stop.
  schema: [Timeframe, Stop Timeframe]
- name: BarcodeReading
  description: A scan event recorded against an item at pickup or delivery.
  schema: Barcode Reading
