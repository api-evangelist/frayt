aid: frayt
name: FRAYT
description: 'FRAYT (Frayt Technologies, Inc., Cincinnati, Ohio) operates an on-demand
  and scheduled middle-mile and last-mile delivery marketplace that connects shippers
  to a vetted nationwide network of owner-operator drivers running everything from
  cars and midsize vehicles to pickups, cargo vans and box trucks. The FRAYT Client
  API is a versioned REST API (v2.2) over JSON, secured with OAuth 2.0 client-credentials
  bearer tokens, that lets a TMS, ERP or storefront price a delivery as an "estimate",
  authorize it into a "match", track it through the driver lifecycle, tip a driver
  and cancel it — with webhook callbacks defined in the OpenAPI itself for real-time
  match and driver-location updates. A full sandbox environment mirrors production.'
