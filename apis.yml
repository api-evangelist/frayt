apis:
- name: FRAYT Client API
  description: 'REST API (v2.2) for FRAYT''s on-demand and scheduled delivery marketplace.
    Price a delivery with the match-estimate endpoints, authorize an estimate into
    a Match, retrieve and update a Match, update a stop to add a driver tip, and cancel
    a Match. OAuth 2.0 client-credentials issues the bearer token every other call
    requires. Webhook callbacks (match_update) are declared inline in the OpenAPI so
    subscribers receive the full Match payload on every state transition.'
