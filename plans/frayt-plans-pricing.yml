plan_count: 0
note: >-
  FRAYT publishes NO plans, NO tiers and NO rate card. There is no /pricing page —
  it returns 404 and no pricing link appears anywhere in the site navigation or
  footer. Pricing is transactional and quoted per shipment: the FAQ states "each
  delivery's cost depends on dimensions, weight, and the mileage of each shipment",
  and the only way to see a price is to call the API's own estimate endpoint
  (POST /api/v2.2/matches/estimate) or use the platform's instant-quote UI. There is
  no separate charge for API access itself — the API is an ordering channel for the
  delivery service, not a metered product with its own plan. Volume customers
  negotiate "termed billing" with a sales rep. This is an honest zero, not a gap in
  the search.
pricing_model:
  type: usage-based-quoted
  unit: per delivery (per Match)
  drivers_of_price: [distance/mileage, weight, dimensions, service level, vehicle class, accessorials]
  api_metering: none
  api_surcharge: none
  quote_mechanism:
    api: POST https://api.frayt.com/api/v2.2/matches/estimate
    ui: FRAYT Platform instant estimate
  note: >-
    The estimate endpoint returns a real dollar amount before the delivery is
    authorized, which makes price discovery fully programmatic even though no rate
    card is published.
